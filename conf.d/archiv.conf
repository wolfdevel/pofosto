# Reines IMAP-Archiv: kein LMTP, keine Submission, kein Sieve.
protocols = imap

# Nur IPv4 lauschen. Docker leitet die Port-Weiterleitung ohnehin auf
# IPv4 im Container; vermeidet Startfehler, wenn IPv6 im Container fehlt.
listen = *

# Klartext-Login nur über TLS (Default, hier explizit)
auth_allow_cleartext = no
