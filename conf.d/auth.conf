# Ersetzt die auth.conf des Images (statischer Testbenutzer) durch eine
# Benutzerdatei vom Docker-Host (siehe README, Verzeichnis ARCHIV_DIR).
# Format: benutzer:{SHA512-CRYPT}hash:::::
passdb passwd-file {
  passwd_file_path = /etc/dovecot/local/users
}

userdb passwd-file {
  passwd_file_path = /etc/dovecot/local/users
}

# Mail-Pfade kommen aus der dovecot.conf des Images:
#   mail_home = /srv/vmail/%{user | lower}
#   mail_path = ~/mail   (Maildir)
