# Volltextsuche (Flatcurve/Xapian): IMAP-Suchen im Archiv laufen auf
# dem Server statt im Client - wichtig bei großen Archiven.
mail_plugins {
  fts = yes
  fts_flatcurve = yes
}

fts_autoindex = yes
fts_search_add_missing = yes

language_tokenizers = generic email-address
language_tokenizer_generic_algorithm = simple

language de {
  default = yes
  filters = lowercase snowball stopwords
}

language en {
  filters = lowercase snowball english-possessive stopwords
}

fts flatcurve {
  substring_search = yes
}
